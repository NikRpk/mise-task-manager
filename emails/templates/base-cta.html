<!DOCTYPE html>
<!--
  Base template: CTA (call-to-action) email.
  Used for: sign-up confirmation, password recovery, magic link sign-in.

  This file uses CSS custom properties (--token-*) so it can be opened directly
  in a browser to preview, or driven by emails/playground.html to try out colors
  live. Supabase's mailer does NOT support <style> blocks reliably across all
  clients, so `emails/build.js` inlines these into `style="..."` attributes when
  generating the final emails/output/*.html files — don't hand-edit the output,
  edit this file (and emails/theme.json) instead.

  Placeholders (replaced by emails/build.js):
    {{SUBJECT}}   - <title> / email subject
    {{HEADING}}   - h1 text
    {{BODY}}      - paragraph under the heading
    {{BUTTON}}    - CTA button label
    {{URL}}       - Supabase template variable, e.g. {{ "{{ .ConfirmationURL }}" }}
    {{FOOTER}}    - small print under the card
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{SUBJECT}}</title>
<style>
  :root {
    --token-navy: #003366;
    --token-navy-muted: #5A7897;
    --token-porcelain: #FDFFFC;
    --token-raspberry: #960050;
    --token-amber: #FF9F1C;
    --token-lime: #50C846;
    --token-border: #E7EAE4;
    --token-card-bg: #FFFFFF;
  }
  body { margin: 0; padding: 0; background-color: var(--token-porcelain); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .page { background-color: var(--token-porcelain); }
  .cell { padding: 40px 16px; }
  .card { max-width: 480px; width: 100%; background-color: var(--token-card-bg); border-radius: 16px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,51,102,0.10); }
  .accent-bar { background-color: var(--token-amber); height: 6px; line-height: 6px; font-size: 0; }
  .brand-row { padding: 28px 40px 0 40px; }
  .brand-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background-color: var(--token-lime); margin-right: 8px; vertical-align: middle; }
  .brand-name { font-size: 20px; font-weight: 700; color: var(--token-navy); letter-spacing: -0.02em; vertical-align: middle; }
  h1.heading { margin: 0; padding: 24px 40px 8px 40px; font-size: 22px; line-height: 1.3; color: var(--token-navy); font-weight: 600; }
  p.body-text { margin: 0; padding: 0 40px 24px 40px; font-size: 15px; line-height: 1.6; color: var(--token-navy-muted); }
  .button-row { padding: 0 40px 32px 40px; }
  a.cta-button { display: inline-block; background-color: var(--token-amber); color: var(--token-navy); text-decoration: none; font-size: 15px; font-weight: 700; padding: 12px 28px; border-radius: 8px; }
  .fallback-row { padding: 20px 40px 32px 40px; border-top: 1px solid var(--token-border); }
  p.fallback-label { margin: 0; font-size: 13px; line-height: 1.6; color: var(--token-navy-muted); }
  p.fallback-url { margin: 8px 0 0 0; font-size: 13px; line-height: 1.6; word-break: break-all; }
  a.fallback-link { color: var(--token-raspberry); }
  p.footer { margin: 24px 0 0 0; font-size: 12px; color: var(--token-navy-muted); text-align: center; }
</style>
</head>
<body>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="page">
    <tr>
      <td align="center" class="cell">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" class="card">
          <tr><td class="accent-bar">&nbsp;</td></tr>
          <tr>
            <td class="brand-row">
              <span class="brand-dot">&nbsp;</span>
              <span class="brand-name">Mise</span>
            </td>
          </tr>
          <tr><td><h1 class="heading">{{HEADING}}</h1></td></tr>
          <tr><td><p class="body-text">{{BODY}}</p></td></tr>
          <tr>
            <td class="button-row">
              <a href="{{URL}}" class="cta-button">{{BUTTON}}</a>
            </td>
          </tr>
          <tr>
            <td class="fallback-row">
              <p class="fallback-label">If the button above doesn't work, copy and paste this link into your browser:</p>
              <p class="fallback-url"><a href="{{URL}}" class="fallback-link">{{URL}}</a></p>
            </td>
          </tr>
        </table>
        <p class="footer">{{FOOTER}}</p>
      </td>
    </tr>
  </table>
</body>
</html>
