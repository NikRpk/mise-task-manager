<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Mise password was changed</title>
</head>
<body style="margin:0;padding:0;background-color:#EEF6FF;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#EEF6FF;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;background-color:#FFFFFF;border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(0,51,102,0.10);">
          <tr><td style="background-color:#FF9F1C;height:6px;line-height:6px;font-size:0;">&nbsp;</td></tr>
          <tr>
            <td style="padding:28px 40px 0 40px;">
              <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background-color:#50C846;margin-right:8px;vertical-align:middle;">&nbsp;</span>
              <span style="font-size:20px;font-weight:700;color:#003366;letter-spacing:-0.02em;vertical-align:middle;">Mise</span>
            </td>
          </tr>
          <tr><td><h1 style="margin:0;padding:24px 40px 8px 40px;font-size:22px;line-height:1.3;color:#003366;font-weight:600;">Your password was changed</h1></td></tr>
          <tr><td><p style="margin:0;padding:0 40px 32px 40px;font-size:15px;line-height:1.6;color:#5A7897;">The password for your Mise account was recently changed. If you made this change, no action is needed.</p></td></tr>
        </table>
        <p style="margin:24px 0 0 0;font-size:12px;color:#5A7897;text-align:center;">If you didn't make this change, reset your password immediately from the login page.</p>
      </td>
    </tr>
  </table>
